<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Face Mask Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    #container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay { pointer-events: none; }
    #controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }
    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button, select {
      padding: 14px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button {
      background: #3b82f6;
      color: white;
      flex: 1;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    button.danger { background: #ef4444; }
    select {
      background: #222;
      color: white;
      border: 1px solid #444;
    }
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      z-index: 10;
      display: none;
    }
    #status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }
    #result {
      margin-top: 20px;
      max-width: 400px;
      display: none;
    }
    #result img {
      width: 100%;
      border-radius: 12px;
    }
    #downloadBtn {
      margin-top: 12px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Face Mask Camera</h1>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="countdown">3</div>
  </div>

  <div id="controls">
    <div class="row">
      <select id="timerSelect">
        <option value="3">3 seconds</option>
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>

    <div class="row">
      <button id="startBtn">Start Camera</button>
      <button id="captureBtn" disabled>Take Photo</button>
    </div>
  </div>

  <div id="status">Click "Start Camera" to begin</div>

  <div id="result">
    <img id="resultImg" />
    <button id="downloadBtn">Download Photo</button>
  </div>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const { FaceLandmarker, FilesetResolver, DrawingUtils } = vision;

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const countdownEl = document.getElementById("countdown");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const timerSelect = document.getElementById("timerSelect");
    const resultDiv = document.getElementById("result");
    const resultImg = document.getElementById("resultImg");
    const downloadBtn = document.getElementById("downloadBtn");

    let faceLandmarker = null;
    let stream = null;
    let animationId = null;
    let isCapturing = false;

    async function initFaceLandmarker() {
      statusEl.textContent = "Loading face detection model...";
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      statusEl.textContent = "Model ready";
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // Set canvas size to match video
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        startBtn.disabled = true;
        captureBtn.disabled = false;
        statusEl.textContent = "Camera ready – pose and press Take Photo";

        detectLoop();
      } catch (err) {
        statusEl.textContent = "Camera error: " + err.message;
        console.error(err);
      }
    }

    function detectLoop() {
      if (!faceLandmarker || video.readyState < 2) {
        animationId = requestAnimationFrame(detectLoop);
        return;
      }

      const results = faceLandmarker.detectForVideo(video, performance.now());

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw the video frame first
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      if (results.faceLandmarks && results.faceLandmarks.length > 0) {
        const landmarks = results.faceLandmarks[0];

        // Get face oval points (MediaPipe face oval indices)
        // We'll use a simple method: find min/max of all landmarks to create a covering oval
        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        for (const point of landmarks) {
          if (point.x < minX) minX = point.x;
          if (point.x > maxX) maxX = point.x;
          if (point.y < minY) minY = point.y;
          if (point.y > maxY) maxY = point.y;
        }

        const centerX = ((minX + maxX) / 2) * canvas.width;
        const centerY = ((minY + maxY) / 2) * canvas.height;
        const radiusX = ((maxX - minX) / 2) * canvas.width * 1.15; // a bit larger to fully cover
        const radiusY = ((maxY - minY) / 2) * canvas.height * 1.25;

        // Draw solid black oval mask
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();
      }

      animationId = requestAnimationFrame(detectLoop);
    }

    function startCountdown() {
      if (isCapturing) return;
      isCapturing = true;
      captureBtn.disabled = true;

      let seconds = parseInt(timerSelect.value);
      countdownEl.style.display = "block";
      countdownEl.textContent = seconds;

      const interval = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          countdownEl.textContent = seconds;
        } else {
          clearInterval(interval);
          countdownEl.style.display = "none";
          takePhoto();
        }
      }, 1000);
    }

    function takePhoto() {
      // The canvas already has the video + black mask drawn
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      resultImg.src = dataUrl;
      resultDiv.style.display = "block";
      statusEl.textContent = "Photo captured!";
      isCapturing = false;
      captureBtn.disabled = false;

      // Scroll to result
      resultDiv.scrollIntoView({ behavior: "smooth" });
    }

    downloadBtn.addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `masked-photo-${Date.now()}.jpg`;
      link.href = resultImg.src;
      link.click();
    });

    startBtn.addEventListener("click", startCamera);
    captureBtn.addEventListener("click", startCountdown);

    // Initialize model on load
    initFaceLandmarker();
  </script>
</body>
</html>
