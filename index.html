<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simple Camera + Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
    }
    #container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      background: #222;
      border-radius: 16px;
      overflow: hidden;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    canvas {
      display: none;
    }
    #controls {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    button, select {
      padding: 14px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      flex: 1;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    select {
      background: #222;
      color: white;
      border: 1px solid #444;
    }
    #status {
      margin-top: 16px;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      min-height: 24px;
    }
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 20px black;
      display: none;
      z-index: 10;
    }
    #result {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
      display: none;
    }
    #result img {
      width: 100%;
      border-radius: 12px;
    }
    #downloadBtn {
      margin-top: 12px;
      width: 100%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <h1>Simple Camera + Timer</h1>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="countdown">3</div>
  </div>

  <div id="controls">
    <div class="row">
      <select id="timerSelect">
        <option value="3">3 seconds</option>
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>

    <div class="row">
      <button id="startBtn">Start Camera</button>
      <button id="captureBtn" disabled>Take Photo</button>
    </div>
  </div>

  <div id="status">Click "Start Camera"</div>

  <div id="result">
    <img id="resultImg" />
    <button id="downloadBtn">Download Photo</button>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const timerSelect = document.getElementById("timerSelect");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");
    const resultDiv = document.getElementById("result");
    const resultImg = document.getElementById("resultImg");
    const downloadBtn = document.getElementById("downloadBtn");

    let stream = null;
    let isCapturing = false;

    startBtn.addEventListener("click", async () => {
      try {
        statusEl.textContent = "Requesting camera permission...";
        
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 720 },
            height: { ideal: 1280 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        startBtn.disabled = true;
        captureBtn.disabled = false;
        statusEl.textContent = "Camera is ready. Choose timer and press Take Photo.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error: " + err.message;
        alert("Camera error: " + err.message);
      }
    });

    captureBtn.addEventListener("click", () => {
      if (isCapturing) return;
      isCapturing = true;
      captureBtn.disabled = true;

      let seconds = parseInt(timerSelect.value);
      countdownEl.style.display = "block";
      countdownEl.textContent = seconds;

      const timer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          countdownEl.textContent = seconds;
        } else {
          clearInterval(timer);
          countdownEl.style.display = "none";
          takePhoto();
        }
      }, 1000);
    });

    function takePhoto() {
      // Set canvas size to video size
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // Draw current video frame
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Show result
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      resultImg.src = dataUrl;
      resultDiv.style.display = "block";
      statusEl.textContent = "Photo captured!";

      isCapturing = false;
      captureBtn.disabled = false;

      resultDiv.scrollIntoView({ behavior: "smooth" });
    }

    downloadBtn.addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `photo-${Date.now()}.jpg`;
      link.href = resultImg.src;
      link.click();
    });
  </script>
</body>
</html>
