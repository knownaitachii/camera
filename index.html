<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Face Mask Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 12px; }
    #container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      background: #222;
      border-radius: 16px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #controls {
      margin-top: 18px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    button, select {
      padding: 14px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      flex: 1;
    }
    button {
      background: #3b82f6;
      color: white;
    }
    button:disabled {
      background: #555;
    }
    select {
      background: #222;
      color: white;
      border: 1px solid #444;
    }
    #status {
      margin-top: 14px;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      min-height: 24px;
    }
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 20px black;
      display: none;
      z-index: 20;
    }
    #result {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
      display: none;
    }
    #result img {
      width: 100%;
      border-radius: 12px;
    }
    #downloadBtn {
      margin-top: 12px;
      width: 100%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <h1>Face Mask Camera</h1>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="countdown">3</div>
  </div>

  <div id="controls">
    <div class="row">
      <select id="timerSelect">
        <option value="3">3 seconds</option>
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>
    <div class="row">
      <button id="startBtn">Start Camera</button>
      <button id="captureBtn" disabled>Take Photo</button>
    </div>
  </div>

  <div id="status">Click "Start Camera"</div>

  <div id="result">
    <img id="resultImg" />
    <button id="downloadBtn">Download Photo</button>
  </div>

  <script type="module">
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const timerSelect = document.getElementById("timerSelect");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");
    const resultDiv = document.getElementById("result");
    const resultImg = document.getElementById("resultImg");
    const downloadBtn = document.getElementById("downloadBtn");

    let stream = null;
    let faceLandmarker = null;
    let animationId = null;
    let isCapturing = false;
    let lastFace = null;

    // Load MediaPipe
    async function loadFaceModel() {
      try {
        statusEl.textContent = "Loading face detection...";
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
        const { FaceLandmarker, FilesetResolver } = vision;

        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1
        });

        statusEl.textContent = "Face detection ready";
      } catch (err) {
        console.error("Face model failed:", err);
        statusEl.textContent = "Face detection failed - will use simple center mask";
        faceLandmarker = null;
      }
    }

    // Start Camera
    startBtn.addEventListener("click", async () => {
      try {
        statusEl.textContent = "Requesting camera...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        startBtn.disabled = true;
        captureBtn.disabled = false;
        statusEl.textContent = "Camera ready. Pose and press Take Photo.";

        // Start drawing loop
        drawLoop();
      } catch (err) {
        statusEl.textContent = "Camera error: " + err.message;
        alert(err.message);
      }
    });

    // Drawing loop (video + mask)
    function drawLoop() {
      if (video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (faceLandmarker) {
          const results = faceLandmarker.detectForVideo(video, performance.now());
          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const landmarks = results.faceLandmarks[0];
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            for (const p of landmarks) {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
              if (p.y < minY) minY = p.y;
              if (p.y > maxY) maxY = p.y;
            }
            lastFace = { minX, maxX, minY, maxY };
          }
        }

        // Draw mask
        if (lastFace) {
          const centerX = ((lastFace.minX + lastFace.maxX) / 2) * canvas.width;
          const centerY = ((lastFace.minY + lastFace.maxY) / 2) * canvas.height;
          const radiusX = ((lastFace.maxX - lastFace.minX) / 2) * canvas.width * 1.25;
          const radiusY = ((lastFace.maxY - lastFace.minY) / 2) * canvas.height * 1.35;

          ctx.beginPath();
          ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.fillStyle = "#000";
          ctx.fill();
        } else {
          // Fallback: simple center mask if no face detected
          const cx = canvas.width / 2;
          const cy = canvas.height * 0.42;
          ctx.beginPath();
          ctx.ellipse(cx, cy, canvas.width * 0.28, canvas.height * 0.22, 0, 0, Math.PI * 2);
          ctx.fillStyle = "#000";
          ctx.fill();
        }
      }
      animationId = requestAnimationFrame(drawLoop);
    }

    // Timer + Capture
    captureBtn.addEventListener("click", () => {
      if (isCapturing) return;
      isCapturing = true;
      captureBtn.disabled = true;

      let seconds = parseInt(timerSelect.value);
      countdownEl.style.display = "block";
      countdownEl.textContent = seconds;

      const timer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          countdownEl.textContent = seconds;
        } else {
          clearInterval(timer);
          countdownEl.style.display = "none";
          takePhoto();
        }
      }, 1000);
    });

    function takePhoto() {
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      resultImg.src = dataUrl;
      resultDiv.style.display = "block";
      statusEl.textContent = "Photo captured with mask!";
      isCapturing = false;
      captureBtn.disabled = false;
      resultDiv.scrollIntoView({ behavior: "smooth" });
    }

    downloadBtn.addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = `masked-${Date.now()}.jpg`;
      a.href = resultImg.src;
      a.click();
    });

    // Load model when page opens
    loadFaceModel();
  </script>
</body>
</html>
